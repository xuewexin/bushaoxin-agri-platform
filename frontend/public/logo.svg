<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF3800"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ED573"/>
      <stop offset="100%" stop-color="#10AC84"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#FF3800" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 徽标背景与心形盾牌 -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#brandGrad)" filter="url(#dropShadow)"/>
    <!-- 舒适无忧爱心与麦穗叶子 -->
    <path d="M30 48 C20 40 14 32 14 24 C14 17 19 12 25 12 C28 12 30 14 30 14 C30 14 32 12 35 12 C41 12 46 17 46 24 C46 32 40 40 30 48 Z" fill="#FFFFFF" opacity="0.95"/>
    <!-- 青翠生态叶芽 -->
    <path d="M30 16 C33 22 40 24 43 21 C41 28 34 32 30 32 C26 32 19 28 17 21 C20 24 27 22 30 16 Z" fill="url(#leafGrad)"/>
    <!-- 微笑弧线 (象征安心舒心) -->
    <path d="M22 33 Q30 41 38 33" stroke="#FF5000" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 品牌文字：不烧心 -->
  <text x="82" y="42" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="900" fill="#FF5000" letter-spacing="-0.5">
    不烧心
  </text>
  <rect x="180" y="22" width="46" height="20" rx="4" fill="#E8F5E9"/>
  <text x="186" y="36" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#2E7D32">
    产销直供
  </text>

  <!-- 标语：好产品，不烧心 -->
  <text x="84" y="60" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#2BB673" letter-spacing="1">
    好产品，不烧心
  </text>
  <text x="180" y="60" font-family="Arial, sans-serif" font-size="10" font-weight="500" fill="#999999">
    | 源头纯天然 绿色放心购
  </text>
</svg>
